[project]
name = "s34-add-pinned-index"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["keeper==1.0"]

[tool.uv.sources]
iniconfig = { index = "alt" }

[[tool.uv.index]]
name = "local"
url = "http://127.0.0.1:__PORT__/simple/"
default = true

[[tool.uv.index]]
name = "alt"
url = "http://127.0.0.1:__PORT__/alt/simple/"
